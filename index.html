<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRINOX PROJECT GAMES</title>
    <link rel="icon" type="image/png" href="assets/logo site/images/favicon.png">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

    <!-- CONTENEUR GLOBAL EN 3 COLONNES (Bannière gauche | Site | Bannière droite) -->
    <div class="page-wrapper">
        
        <!-- BANNIÈRE GAUCHE (Image fixe affiliation) -->
        <aside class="side-banner">
            <a href="https://www.instant-gaming.com/fr/?igr=TRINOX18" target="_blank" class="my-banner">
                <img src="assets/logo site/images/ma-banniere-perso.jpg" alt="Instant Gaming - Trinox18">
            </a>
        </aside>

        <!-- CONTENU CENTRAL DE TON SITE -->
        <div class="site-container" style="flex-grow: 1; max-width: 1400px;">
            
            <!-- En-tête -->
            <header class="banner-header">
                <a href="index.html">
                    <img src="assets/logo site/images/logo-trinox.png" alt="Trinox Project Games" class="banner-img">
                </a>
            </header>

            <!-- MENU PRINCIPAL (Accueil + Jeux PC) -->
            <nav class="main-menu" style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="main-btn active" id="accueilBtn" onclick="showAccueil()">🏠 Accueil</button>
                <button class="main-btn" id="jeuxPcBtn" onclick="showJeuxPC()">Jeux PC 🎮</button>
            </nav>

            <!-- SOUS-MENU (Caché par défaut) -->
            <div class="sub-menu-container" id="subMenuContainer" style="display: none;">
                <div class="mode-selectors">
                    <button class="mode-btn active" onclick="setBrowseMode('style')">Par Style</button>
                    <button class="mode-btn" onclick="setBrowseMode('alpha')">Par Ordre Alphabétique (A-Z)</button>
                </div>

                <!-- Liste des Styles -->
                <div id="styleFilters" class="filter-row">
                    <button class="filter-btn active" onclick="handleStyleFilter('all', event)">Tous</button>
                    <button class="filter-btn" onclick="handleStyleFilter('survival', event)">Survie</button>
                    <button class="filter-btn" onclick="handleStyleFilter('fps', event)">FPS / TPS</button>
                    <button class="filter-btn" onclick="handleStyleFilter('action', event)">Action</button>
                    <button class="filter-btn" onclick="handleStyleFilter('adventure', event)">Aventure</button>
                    <button class="filter-btn" onclick="handleStyleFilter('rpg', event)">RPG</button>
                    <button class="filter-btn" onclick="handleStyleFilter('cars', event)">Voiture / Course</button>
                    <button class="filter-btn" onclick="handleStyleFilter('simulation', event)">Simulation</button>
                    <button class="filter-btn" onclick="handleStyleFilter('strategy', event)">Stratégie</button>
                    <button class="filter-btn" onclick="handleStyleFilter('horror', event)">Horreur</button>
                    <button class="filter-btn" onclick="handleStyleFilter('roguelike', event)">Rogue-like</button>
                </div>

                <!-- Liste Alphabétique (A-Z) -->
                <div id="alphaFilters" class="filter-row" style="display: none; flex-wrap: wrap;">
                    <button class="filter-btn active" onclick="filterByLetter('all', event)">Tous</button>
                    <script>
                        const letters = "abcdefghijklmnopqrstuvwxyz".split("");
                        letters.forEach(l => {
                            document.write(`<button class="filter-btn" onclick="filterByLetter('${l}', event)">${l.toUpperCase()}</button>`);
                        });
                    </script>
                </div>
            </div>

            <!-- CONTENU : LISTE DES JEUX GENEREE PAR GAMES.JS -->
            <main>
                <section class="games-grid" id="gamesContainer">
                    <!-- Les cartes sont générées automatiquement par games.js ! -->
                </section>
            </main>

            <!-- SECTION DES DERNIERS COMMENTAIRES -->
            <section class="recent-comments-section" style="margin-top: 40px;">
                <h2>💬 Derniers commentaires</h2>
                <div id="recentCommentsContainer" class="recent-comments-grid"></div>
            </section>

        </div>

        <!-- BANNIÈRE DROITE (Image fixe affiliation) -->
        <aside class="side-banner">
            <a href="https://www.instant-gaming.com/fr/?igr=TRINOX18" target="_blank" class="my-banner">
                <img src="assets/logo site/images/ma-banniere-perso.jpg" alt="Instant Gaming - Trinox18">
            </a>
        </aside>

    </div>

    <!-- SCRIPT QUI GÉNÈRE LES JEUX EN PREMIER -->
    <script src="games.js"></script>

    <!-- LOGIQUE ET FILTRES -->
    <script>
        let currentMode = 'style';

        function showAccueil() {
            document.getElementById('accueilBtn').classList.add('active');
            document.getElementById('jeuxPcBtn').classList.remove('active');
            document.getElementById('subMenuContainer').style.display = 'none';
            filterByStyle('all');
        }

        function showJeuxPC() {
            document.getElementById('jeuxPcBtn').classList.add('active');
            document.getElementById('accueilBtn').classList.remove('active');
            document.getElementById('subMenuContainer').style.display = 'block';
            setBrowseMode('style');
        }

        function setBrowseMode(mode) {
            currentMode = mode;
            const styleBtn = document.querySelectorAll('.mode-btn')[0];
            const alphaBtn = document.querySelectorAll('.mode-btn')[1];
            const styleFilters = document.getElementById('styleFilters');
            const alphaFilters = document.getElementById('alphaFilters');

            if (mode === 'style') {
                styleBtn.classList.add('active');
                alphaBtn.classList.remove('active');
                styleFilters.style.display = 'flex';
                alphaFilters.style.display = 'none';
                filterByStyle('all');
            } else {
                alphaBtn.classList.add('active');
                styleBtn.classList.remove('active');
                alphaFilters.style.display = 'flex';
                styleFilters.style.display = 'none';
                filterByLetter('all');
            }
        }

        function handleStyleFilter(style, evt) {
            if (evt) {
                document.querySelectorAll('#styleFilters .filter-btn').forEach(btn => btn.classList.remove('active'));
                evt.target.classList.add('active');
            }
            filterByStyle(style);
        }

        function handleLetterFilter(letter, evt) {
            if (evt) {
                document.querySelectorAll('#alphaFilters .filter-btn').forEach(btn => btn.classList.remove('active'));
                evt.target.classList.add('active');
            }
            filterByLetter(letter);
        }

        window.onload = function() {
            showAccueil();
        };
    </script>
    <script src="script.js"></script>    
</body>
</html>
