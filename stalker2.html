<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stalker 2: Heart of Chornobyl - Mon Site de Jeux</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="site-container">
        <main>
            <section class="game-details-page">
                <a href="index.html" class="back-btn">← Retour aux jeux</a>
                
                <h2>Stalker 2: Heart of Chornobyl</h2>
                
                <!-- Galerie de Captures d'écran (avec défilement horizontal) -->
                <div class="media-section">
                    <h3>Captures d'écran</h3>
                    <div class="carousel-container">
                        <button class="carousel-btn prev-btn" onclick="scrollCarousel('imagesScroll', -300)">❮</button>
                        <div class="carousel-track" id="imagesScroll">
                            <img src="assets/stalker2/images/cover.jpg" alt="Cover">
                            <img src="assets/stalker2/images/screenshot-1.jpg" alt="Screenshot 1">
                            <img src="assets/stalker2/images/screenshot-2.jpg" alt="Screenshot 2">
                        </div>
                        <button class="carousel-btn next-btn" onclick="scrollCarousel('imagesScroll', 300)">❯</button>
                    </div>
                </div>

                <!-- Galerie de Vidéos (avec défilement horizontal) -->
                <div class="media-section">
                    <h3>Vidéos</h3>
                    <div class="carousel-container">
                        <button class="carousel-btn prev-btn" onclick="scrollCarousel('videosScroll', -300)">❮</button>
                        <div class="carousel-track" id="videosScroll">
                            <div class="carousel-video-item"><video controls><source src="assets/stalker2/video/trailer.mp4" type="video/mp4"></video></div>
                            <div class="carousel-video-item"><video controls><source src="assets/stalker2/video/gameplay.mp4" type="video/mp4"></video></div>
                        </div>
                        <button class="carousel-btn next-btn" onclick="scrollCarousel('videosScroll', 300)">❯</button>
                    </div>
                </div>

                <!-- Section Informations -->
                <div class="detail-info">
                    <h3>Description</h3>
                    <p>Plongez dans la Zone d'exclusion de Tchernobyl dans ce jeu de tir et de survie ultra immersif.</p>

                    <div class="system-check-box">
                        <p>💡 Tu veux savoir si le jeu tourne sur ton PC ?</p>
                        <a href="https://systemreqs.com/fr/" target="_blank" class="btn-system">Vérifier ma configuration sur SystemReqs</a>
                    </div>

                    <div class="download-container">
                        <a href="#" class="btn-download-big" target="_blank">Télécharger la démo</a>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Fonction pour faire défiler les carrousels
        function scrollCarousel(id, distance) {
            const track = document.getElementById(id);
            track.scrollBy({ left: distance, behavior: 'smooth' });
        }
    </script>
<script src="script.js"></script>
</body>
</html>
